<p>service-product-image-event works!</p>

<table border="1" style="border-collapse: collapse; text-align: center;">
  <thead>
    <tr>
      <td>Ma San Pham</td>
      <td>Ten San Pham</td>
      <td>Gia San Pham</td>
      <td>Picture</td>
      <td>#</td>
    </tr>
  </thead>
  <tbody>
    <!-- Đặt *ngFor ở thẻ tr -->
    <tr *ngFor="let p of products">
      <td>{{ p.ProductId }}</td>
      <td>{{ p.ProductName }}</td>
      <td>{{ p.Price }}</td>
      <td>
        <!-- Dùng Property Binding [src] và thêm width/height để căn chỉnh ảnh -->
        <img [src]="p.Image" [alt]="p.ProductName" width="100" height="100" style="object-fit: contain;">
      </td>
      <td>
        <a style="cursor:pointer;" (click)="viewDetail(p)" title="Click here to view detail">Details</a>
      </td>
    </tr>
  </tbody>
</table>
